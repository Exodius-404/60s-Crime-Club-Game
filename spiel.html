<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Rad des Schicksals</title>

    <style>
        :root {
            --bg: #000;
            --accent: #fff;
            --accent-2: #ffd966;
            --muted: #777;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--accent);
            font-family: Inter, system-ui, sans-serif;
            height: 100vh;
            overflow-y: hidden;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            isolation: isolate;
            /* trennt die Z-Ebenen sauber */
        }

        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* verhindert Scrollen */
            height: 100vh;
            width: 100vw;
            position: fixed;
            touch-action: none;
            /* verhindert Wischen auf mobilen Geräten */

            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        #doneList {
            display: none;
            max-height: 200px;
            overflow-y: auto;
            overflow-x: hidden;
            border: 1px solid var(--muted);
            border-radius: 0.5em;
            padding: 0.5em;
            margin-top: 2vh;
            text-align: left;
            background: #111;
            width: 60vw;
            max-width: 300px;
        }

        #doneList::-webkit-scrollbar {
            width: 8px;
        }

        #doneList::-webkit-scrollbar-thumb {
            background-color: var(--accent-2);
            border-radius: 4px;
        }

        h1 {
            font-size: clamp(16px, 2vw, 20px);
            margin-bottom: 1vh;
        }

        input,
        button {
            font-family: inherit;
            font-size: clamp(14px, 2vw, 18px);
        }

        input#nameInput {
            padding: 10px;
            border: none;
            border-bottom: 1px solid var(--muted);
            background: transparent;
            color: var(--accent);
            font-family: Inter, system-ui, sans-serif;
            font-size: clamp(15px, 3vw, 24px);
            font-weight: 700;
            line-height: 1;
            text-transform: capitalize;
            width: 60vw;
            max-width: 300px;
            text-align: left;
        }

        button {
            background: var(--accent-2);
            color: #111;
            border: none;
            padding: 0.7em 1.2em;
            border-radius: 0.5em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.5s;
            font-size: clamp(14px, 1.5vw, 16px);
            margin: 2px;
        }

        #startArea {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vh;
        }

        .dots {
            display: inline-block;
            width: 1.5em;
            text-align: left;
            overflow: hidden;
            vertical-align: bottom;
            animation: dotsAnim 1s steps(4, end) infinite;
            opacity: 0;
        }

        #duBistSpan {
            display: inline-block;
            position: relative;
        }

        #dotsSpan {
            display: inline-block;
            position: absolute;
            left: 100%;
            top: 0;
            white-space: nowrap;
            overflow: hidden;
        }

        #duBistSpan,
        #dotsSpan,
        #roleSpan {
            opacity: 0;
            transition: opacity 2s ease;
        }

        #roleSpan {
            display: block;
            margin-top: 1vh;
            font-size: 1.2em;
        }

        .role {
            font-weight: 700;
            font-size: clamp(15px, 3vw, 24px);
            opacity: 0;
            transition: opacity 1s linear;
            text-align: center;
            white-space: normal;
            max-width: 80vw;
            word-wrap: break-word;
            margin-top: 2vh;
            position: relative;
            transform: none;
        }

        .wheelArea {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            /* Abstand zwischen Task-Text und Rad */
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease, transform 1.5s ease;
            width: 90vw;
            max-width: 320px;
            position: fixed;
            bottom: -50%;
            left: 50%;
            transform: translateX(-50%);
            top: 30% !important;
        }

        .wheelArea.show {
            opacity: 1;
        }

        #currentTask {
            display: block !important;
            visibility: visible !important;
            font-size: clamp(14px, 2vw, 16px);
            color: var(--accent-2);
            text-align: center;
            max-width: 100%;
            word-wrap: break-word;
            margin-bottom: 1vh;
        }

        #startArea button {
            min-width: 55px;
            margin-top: 0.5vh;
        }

        #startArea,
        .role,
        .wheelArea {
            position: fixed;
        }

        .wheel {
            width: 70vw;
            max-width: 250px;
            height: 70vw;
            max-height: 250px;
            border-radius: 50%;
            background: #111;
            aspect-ratio: 1 / 1;
            transform-origin: center center;
        }

        #wheelArea button {
            width: 70%;
            min-width: 100px;
        }

        @media (max-height: 700px) {
            .wheel {
                width: 50vw;
                height: 50vw;
            }

            #wheelArea {
                flex-direction: column;
                gap: 1vh;
            }

            #wheelArea button {
                width: 70%;
                margin-top: 0.5em;
            }
        }

        @media (max-height: 660px) {
            .wheel {
                width: 45vw;
                height: 45vw;
            }

            #wheelArea {
                flex-direction: column;
                gap: 1vh;
            }

            #wheelArea button {
                width: 70%;
                margin-top: 0.5em;
            }

            @media (min-width: 300px) {
                .wheel {
                    max-width: 200px;
                    max-height: 200px;
                }

                #wheelArea {
                    flex-direction: column;
                    gap: 1vh;
                }

                #wheelArea button {
                    width: 70%;
                    margin-top: 0.5em;
                }
            }
        }

        @media (max-height: 550px) {
            .wheel {
                width: 45vw;
                height: 45vw;
            }

            #wheelArea {
                flex-direction: column;
                gap: 1vh;
            }

            #wheelArea button {
                width: 70%;
                margin-top: 0.5em;
            }

            @media (min-width: 300px) {
                .wheel {
                    max-width: 100px;
                    max-height: 100px;
                }

                #wheelArea {
                    flex-direction: column;
                    gap: 1vh;
                }

                #wheelArea button {
                    width: 70%;
                    margin-top: 0.5em;
                }
            }
        }

        .pointer {
            width: 0;
            height: 0;
            border-left: 1em solid transparent;
            border-right: 1em solid transparent;
            border-bottom: 1.6em solid var(--accent-2);
            margin: 0 auto;
        }

        .taskText {
            min-height: 3em;
            font-size: clamp(14px, 2vw, 16px);
            margin-bottom: 1vh;
            margin-top: 4%;
            color: var(--accent-2);
            text-align: center;
            max-width: 80vw;
            word-wrap: break-word;
        }

        .item {
            padding: 0.5em 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: clamp(12px, 1.5vw, 14px);
            text-align: left;
        }

        #doneOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #doneOverlayContent {
            background: #111;
            padding: 2em;
            border-radius: 10px;
            max-width: 90vw;
            max-height: 80vh;
            overflow-y: auto;
            color: var(--accent);
            text-align: center;
        }

        #scoreboard {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1em;
        }

        #scoreboard th,
        #scoreboard td {
            padding: 0.5em 1em;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        #scoreboard th {
            color: var(--accent-2);
        }

        #scoreboard td {
            color: var(--accent);
        }

        #doneOverlayList {
            max-height: 200px;
            overflow-y: auto;
            background: #111;
            border: 1px solid var(--muted);
            border-radius: 5px;
            padding: 0.5em;
            text-align: left;
        }

        #doneOverlayList .item {
            padding: 0.5em 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #doneOverlayList .item:last-child {
            border-bottom: none;
        }

        #closeOverlayBtn {
            margin-top: 1em;
            background: var(--accent-2);
            color: #111;
            border: none;
            padding: 0.7em 1.2em;
            border-radius: 0.5em;
            font-weight: 600;
            cursor: pointer;
        }

        #hamburgerBtn {
            position: fixed;
            bottom: 0.1em;
            left: 0.1em;
            width: 2.5em;
            height: 2.5em;
            font-size: 2em;
            background: var(--accent-1);
            color: #111;
            border: none;
            border-radius: 0.5em;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 999;
            padding: 0;
        }

        .hidden {
            display: none !important;
        }

        #hintModal.show {
            display: flex;
        }

        #adminButtons {
            display: flex;
            flex-direction: column;
            gap: 0.5em;
        }

        #adminPanel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            max-width: 90vw;
            height: 80vh;
            /* feste Höhe für Panel */
            padding: 1em;
            background: #111;
            border-radius: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1em;
            overflow: hidden;
            /* kein Scrollen für Panel */
            z-index: 1000;
        }

        #adminButtons {
            flex-shrink: 0;
            /* bleibt immer sichtbar */
        }

        #adminOverview {
            flex-shrink: 0;
            /* bleibt immer sichtbar */
            border: 1px solid var(--muted);
            border-radius: 6px;
            background: #222;
            padding: 0.5em 1em;
            margin-bottom: 0.5em;
        }

        #adminOverview td {
            padding: 0.5em 1em;
            font-weight: bold;
            text-align: center;
            font-size: 1em;
        }

        #adminScoreboardWrapper {
            flex: 1;
            /* nimmt restlichen Platz */
            overflow-y: auto;
            /* scrollt nur die Tabelle */
            border: 1px solid var(--muted);
            border-radius: 6px;
        }

        /* Tabelle im Wrapper */
        #adminScoreboard {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        #adminScoreboard th,
        #adminScoreboard td {
            padding: 0.5em;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9em;
        }

        #adminScoreboard th {
            color: var(--accent-2);
            text-align: left;
            width: 25%;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay .panel {
            background: #222;
            color: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .victim-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        .victim-list button {
            padding: 10px;
            background: #444;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            min-width: 100%;
        }

        .victim-list button:hover {
            background: #666;
        }

        .toast {
            position: fixed;
            bottom: -100px;
            /* Start außerhalb des Screens */
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            opacity: 0;
            transition: all 0.6s ease;
            z-index: 3000;
            width: 90%;
        }

        /* Sichtbar */
        .toast.show {
            bottom: 30px;
            /* Endposition */
            opacity: 1;
        }

        /* --- Hinweis-Toast mit sanfter Animation --- */
        .hint-toast {
            position: fixed;
            bottom: -100px;
            /* Startposition außerhalb des Bildschirms */
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            font-size: 1.1em;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 90%;
            text-align: center;
            opacity: 0;
            transition: all 0.6s ease;
        }

        /* Sichtbarer Zustand */
        .hint-toast.show {
            bottom: 30px;
            opacity: 1;
        }

        /* Optional: weiche Ausblendung, bevor sie entfernt wird */
        .hint-toast.hide {
            bottom: -100px;
            opacity: 0;
        }

        .hint-toast button {
            background: #ffbf00;
            color: black;
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .hint-toast button:hover {
            background: #ffd84d;
        }

        /* --- Hinweis-Overlay (Clubbesucher) --- */
        #hintModal.overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1200;
            /* über allem außer Hamburger (999) */
        }

        #hintModal.hidden {
            display: none !important;
        }

        #hintModal .panel {
            background: #111;
            color: var(--accent);
            padding: 1.5em;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 1em;
            font-family: Inter, system-ui, sans-serif;
        }

        #hintModal h2 {
            color: var(--accent-2);
            font-size: 1.2em;
            margin-bottom: 0.3em;
        }

        #hintModal label {
            font-size: 0.9em;
            color: var(--muted);
            text-align: left;
        }

        #hintModal select,
        #hintModal input {
            background: #222;
            color: var(--accent);
            border: 1px solid var(--muted);
            border-radius: 6px;
            padding: 0.6em;
            font-size: 1em;
            width: 100%;
        }

        #hintModal select:focus,
        #hintModal input:focus {
            outline: none;
            border-color: var(--accent-2);
        }

        #hintModal .btn-row {
            display: flex;
            justify-content: center;
            gap: 1em;
            margin-top: 0.5em;
        }

        #hintModal button {
            padding: 0.6em 1.4em;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #hintCancelBtn {
            background: #444;
            color: var(--accent);
        }

        #hintCancelBtn:hover {
            background: #666;
        }

        #hintSendBtn {
            background: var(--accent-2);
            color: #111;
        }

        #hintSendBtn:hover {
            background: #ffe68a;
        }

        /* --- Mörder-Code Overlay --- */
        #murderCodeModal.overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1200;
            /* über allem außer Hamburger (999) */
        }

        #murderCodeModal.hidden {
            display: none !important;
        }

        #murderCodeModal .panel {
            background: #111;
            color: var(--accent);
            padding: 1.8em;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 1em;
            font-family: Inter, system-ui, sans-serif;
        }

        #murderCodeModal h2 {
            color: var(--accent-2);
            font-size: 1.3em;
            margin-bottom: 0.4em;
        }

        #murderCodeModal label {
            font-size: 0.9em;
            color: var(--muted);
            text-align: left;
        }

        #murderCodeModal input {
            background: #222;
            color: var(--accent);
            border: 1px solid var(--muted);
            border-radius: 6px;
            padding: 0.6em;
            font-size: 1em;
            width: 100%;
            text-align: center;
            letter-spacing: 1px;
        }

        #murderCodeModal input:focus {
            outline: none;
            border-color: var(--accent-2);
        }

        #murderCodeModal .btn-row {
            display: flex;
            justify-content: center;
            gap: 1em;
            margin-top: 0.5em;
        }

        #murderCancelBtn {
            background: #444;
            color: var(--accent);
            border: none;
            padding: 0.6em 1.4em;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #murderCancelBtn:hover {
            background: #666;
        }

        #murderSubmitBtn {
            background: var(--accent-2);
            color: #111;
            border: none;
            padding: 0.6em 1.4em;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #murderSubmitBtn:hover {
            background: #ffe68a;
        }

        /* --- Detective Overlay angepasst wie Mörder-Code Overlay --- */
        #detectiveOverlay.overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1200;
        }

        #detectiveOverlay.hidden {
            display: none !important;
        }

        #detectiveOverlay .panel {
            background: #111;
            color: var(--accent);
            padding: 1.8em;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 1em;
            font-family: Inter, system-ui, sans-serif;
        }

        #detectiveOverlay h2 {
            color: var(--accent-2);
            font-size: 1.3em;
            margin-bottom: 0.4em;
        }

        #detectiveOverlay button {
            background: #444;
            color: var(--accent);
            border: none;
            padding: 0.6em 1.4em;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #detectiveOverlay button:hover {
            background: #666;
        }

        /* --- Rolle anzeigen / verbergen --- */

        #roleArea {
            position: relative;
        }

        #roleSpan {
            position: relative;
            transition: opacity 1s ease, filter 1s ease;
            font-weight: 700;
            user-select: none;

            /* verhindert Markieren */
            -webkit-user-select: none;
            /* Safari/Chrome */
            -moz-user-select: none;
            /* Firefox */
            -ms-user-select: none;
            /* IE/Edge */
        }

        /* 👁️ Rolle langsam verblassen lassen */
        .role-hidden {
            opacity: 0;
            /* Schrift verblasst vollständig */
            filter: blur(50px);
            /* leichter Unschärfeeffekt für "Verschmelzen" */
            transition: opacity 1s ease, filter 1s ease;
        }

        @keyframes blinkEye {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        /* 👁️-Button etwas näher an den Kasten */
        #revealRoleBtn {
            position: fixed;
            top: 70%;
            /* gewünschte vertikale Position */
            left: 50%;
            transform: translate(-50%, -50%);
            background: transparent;
            border: none;
            color: var(--accent-2);
            font-size: 0.6em;
            min-width: 7em;
            cursor: pointer;
            opacity: 0.8;
            transition: none;
            z-index: 999999;
            /* über alles */
            pointer-events: auto;
            /* Klicks erlauben */

            animation: blinkEye 2s infinite;

            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        #revealRoleBtn.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #revealRoleBtn:hover,
        #revealRoleBtn:active {
            opacity: 1;
        }
    </style>
</head>

<body>

    <!-- Overlay für Score und erledigte Aufgaben -->
    <div id="doneOverlay" class="hidden">
        <div id="doneOverlayContent">
            <h2>Scoreboard</h2>
            <table id="scoreboard">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <h2>Erledigte Aufgaben</h2>
            <div id="doneOverlayList"></div>
            <button id="closeOverlayBtn">Schließen</button>
        </div>
    </div>

    <button id="hamburgerBtn" class="hidden">🎲</button>

    <div id="startArea">
        <input id="nameInput" type="text" placeholder="Dein Name">
        <button id="startBtn">Los</button>
    </div>

    <div id="roleArea" class="role"></div>
    <div id="wheelArea" class="wheelArea">
        <div id="currentTask" class="taskText hidden"></div>
        <div class="pointer"></div>
        <div id="wheel" class="wheel"></div>
        <button id="actionBtn">Rad drehen</button>
    </div>

    <div id="adminPanel" class="hidden">
        <h2>Admin Panel</h2>

        <div id="adminButtons">
            <button onclick="clearScoreboard()">Spiel Neustart</button>
        </div>

        <table id="adminOverview">
            <tr>
                <td>🧑‍🤝‍🧑</td>
                <td>🔪</td>
                <td>🕵️</td>
                <td>🎉</td>
            </tr>
            <tr>
                <td id="totalPlayers">0</td>
                <td id="totalMurderers">0</td>
                <td id="totalDetectives">0</td>
                <td id="totalCivilians">0</td>
            </tr>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
        import {
            getFirestore, doc, setDoc, collection, onSnapshot, deleteDoc, query, where, getDocs, getDoc
        } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

        window.setDoc = setDoc;

        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyCbk0sueA9MKv2ZwBoh9zb9muu8MelFq3g",

        const app = initializeApp(firebaseConfig);

        // --- Hilfsfunktionen ---
        function generateId() {
            return '_' + Math.random().toString(36).slice(2, 11);
        }
        window.generateId = generateId;

        export async function saveScore(player) {
            if (!player.id) player.id = generateId();
            const ref = doc(db, "scores", player.id);
            await setDoc(ref, {
                id: player.id,
                name: player.name,
                score: player.score ?? 0,
                role: player.role ?? null,
                completed: player.completed ?? [],
                blockedUntil: player.blockedUntil ?? 0,
                murderCode: player.murderCode ?? null
            }, { merge: true });
        }
        window.saveScore = saveScore;

        export async function loadPlayerFromDB(name) {
            // Prüfe localStorage
            const stored = localStorage.getItem('playerId_' + name);
            let id;

            if (stored) {
                id = stored;
            } else {
                id = generateId();
                localStorage.setItem('playerId_' + name, id);
            }

            // Prüfe, ob Spieler in Firestore existiert
            const ref = doc(db, "scores", id);
            const snap = await getDoc(ref);

            if (snap.exists()) {
                const data = snap.data();
                data.id = id;
                if (data.blockedUntil && Date.now() >= data.blockedUntil) {
                    data.blockedUntil = 0;
                    await setDoc(ref, { blockedUntil: 0 }, { merge: true });
                }
                return data;
            }

            // Spieler neu erstellen
            const player = {
                id,
                name,
                role: null,
                score: 0,
                completed: [],
                blockedUntil: 0
            };
            await saveScore(player);
            return player;
        }
        window.loadPlayerFromDB = loadPlayerFromDB;

        export async function deletePlayer(id) {
            await deleteDoc(doc(db, "scores", id));
        }
        window.deletePlayer = deletePlayer;

        export async function clearScoreboard() {
            const snapshot = await getDocs(collection(db, "scores"));
            for (const s of snapshot.docs) {
                await deleteDoc(doc(db, "scores", s.id));
            }
            window.currentScores = [];
        }
        window.clearScoreboard = clearScoreboard;

        export async function unblockPlayer(id) {
            await setDoc(doc(db, "scores", id), { blockedUntil: 0 }, { merge: true });
        }
        window.unblockPlayer = unblockPlayer;

        function assignDetectiveTask(detective) {
            const taskText = "Das ist deine Chance den Mörder auszuschalten!!";
            showToast(taskText);

            // Overlay öffnen
            openDetectiveOverlay(window.currentScores || [], detective);
        }

        window.assignDetectiveTask = assignDetectiveTask;

        // --- Hilfsfunktion: Mördertask aktualisieren ---
        function updateMurderTask(player) {
            if (!player || player.role !== "murderer" || !player.murderCode) return;

            // Alten Task entfernen
            TASKS.murderer = TASKS.murderer.filter(t => !t.startsWith("Töte eine Person!"));

            // Neuen Task erstellen
            const murderTask = `Töte eine Person!`;
            TASKS.murderer.push(murderTask);
            player.currentTask = murderTask;

            // Wheel neu rendern
            renderWheelForRole("murderer");
            $("currentTask").textContent = murderTask;
        }
        window.updateMurderTask = updateMurderTask;

        // --- Mörder-Overlay ---
        function openMurderOverlay(victims, murderer) {
            const overlay = document.getElementById("murderOverlay");
            const listEl = document.getElementById("murderVictimList");
            listEl.innerHTML = "";

            victims
                .filter(v => v.id !== murderer.id && v.role !== "murderer")
                .forEach(v => {
                    const isBlocked = v.blockedUntil && Date.now() < v.blockedUntil;
                    const btn = document.createElement("button");
                    btn.textContent = isBlocked ? `${v.name} ⏱ gesperrt` : v.name;
                    btn.disabled = isBlocked;

                    if (!isBlocked) {
                        btn.onclick = async () => {
                            const unblockTime = Date.now() + 15 * 60 * 1000;
                            await setDoc(doc(db, "scores", v.id), {
                                blockedUntil: unblockTime
                            }, { merge: true });

                            await addCompleted(`Person getötet: ${v.name}`);

                            showToast(`${v.name} wurde getötet! ⏱ 15 Minuten blockiert`);
                            murderer.currentTask = null;
                            $('currentTask').textContent = "Dreh das Rad...";
                            $('actionBtn').textContent = "Rad drehen";
                            closeMurderOverlay();
                        };
                    }

                    listEl.appendChild(btn);
                });

            overlay.classList.remove("hidden");
        }
        window.openMurderOverlay = openMurderOverlay;

        function closeMurderOverlay() {
            document.getElementById("murderOverlay").classList.add("hidden");
        }
        window.closeMurderOverlay = closeMurderOverlay;

        // --- DETECTIVE OVERLAY + FUNKTIONEN ---
        function openDetectiveOverlay(players, detective) {
            const overlay = document.getElementById("detectiveOverlay");
            const listEl = document.getElementById("detectivePlayerList");
            const taskEl = document.getElementById("currentTask"); // Stelle sicher, dass dieses Element existiert
            listEl.innerHTML = "";

            let hasFreePlayers = false;

            players.forEach(player => {
                if (player.id === detective.id) return;
                if (player.role === "detective") return;

                const isBlocked = player.blockedUntil && Date.now() < player.blockedUntil;
                if (!isBlocked) hasFreePlayers = true;

                const btn = document.createElement("button");
                btn.textContent = isBlocked ? `${player.name} ⏱ gesperrt` : player.name;
                btn.disabled = isBlocked;

                btn.onclick = async () => {
                    const unblockTime = Date.now() + BLOCK_DURATION;
                    await setDoc(doc(db, "scores", player.id), {
                        blockedUntil: unblockTime
                    }, { merge: true });

                    await addCompleted(`Person gesperrt: ${player.name}`);

                    showToast(`${player.name} wurde für 15 Minuten gesperrt! 🕵️‍♂️`);
                    detective.currentTask = null;
                    taskEl.textContent = "Dreh das Rad...";
                    $('actionBtn').textContent = "Rad drehen";
                    closeDetectiveOverlay();
                };

                listEl.appendChild(btn);
            });

            // Aufgabe ausblenden, wenn keine freien Spieler
            if (!hasFreePlayers) {
                taskEl.textContent = "Dreh das Rad...";
                $('actionBtn').textContent = "Rad drehen";
            } else {
                taskEl.textContent = "Das ist deine Chance den Mörder auszuschalten!";
                $('actionBtn').textContent = "Verdächtigen";
            }

            overlay.classList.remove("hidden");
        }

        function closeDetectiveOverlay() {
            document.getElementById("detectiveOverlay").classList.add("hidden");
        }

        window.openDetectiveOverlay = openDetectiveOverlay;
        window.closeDetectiveOverlay = closeDetectiveOverlay;

        // --- DETECTIVE TASK VERWALTUNG ---
        function updateDetectiveTask(player) {
            if (!player || player.role !== "detective") return;

            TASKS.detective = TASKS.detective.filter(t => !t.startsWith("Das ist deine Chance den Mörder auszuschalten!"));
            const detectiveTask = `Das ist deine Chance den Mörder auszuschalten!`;
            TASKS.detective.push(detectiveTask);
            player.currentTask = detectiveTask;

            renderWheelForRole("detective");
            $("currentTask").textContent = detectiveTask;
        }
        window.updateDetectiveTask = updateDetectiveTask;

        // --- Prüfe Mördercode + Overlay ---

        //         showToast("❌ Falscher Code!");

        //     // ✅ Code korrekt

        function checkConnection() {
            if (!navigator.onLine) {
                showToast("❌ Du bist offline. Bitte stelle eine Internetverbindung her.");
                return false;
            }
            return true;
        }

        async function sendClueToDetective(hint) {
            if (!checkConnection()) return false;

            try {
                const detectives = (window.currentScores || []).filter(p => p.role === "detective");
                if (detectives.length === 0) {
                    showToast("❌ Kein Detektiv verfügbar!");
                    return false;
                }

                const randomDetective = detectives[Math.floor(Math.random() * detectives.length)];
                await setDoc(doc(db, "scores", randomDetective.id), { newHint: hint }, { merge: true });
                showToast("✅ Hinweis gesendet! Ein Detektiv wurde informiert.");
                return true;
            } catch (err) {
                console.error("Fehler beim Senden des Hinweises:", err);
                showToast("❌ Fehler beim Senden. Verbindung zur Datenbank fehlgeschlagen.");
                return false;
            }
        }

        window.sendClueToDetective = sendClueToDetective;

        // --- Realtime Listener ---
        const scoresCollection = collection(db, "scores");
        onSnapshot(scoresCollection, async snapshot => {
            const arr = [];
            snapshot.forEach(docSnap => {
                const d = docSnap.data();
                d.id = d.id || docSnap.id;
                arr.push(d);
            });
            window.currentScores = arr;

            if (window.currentPlayer?.id) {
                const me = arr.find(p => p.id === window.currentPlayer.id || p.name === window.currentPlayer.name);
                if (me) {
                    window.currentPlayer = me;
                    if (typeof window.startBlockCountdown === "function") {
                        try { window.startBlockCountdown(); } catch (e) { }
                    }
                }
            }

            // --- Prüfen, ob der aktuelle Spieler ein Detektiv ist und neuen Hinweis hat ---
            if (window.currentPlayer?.role === "detective") {
                const meDoc = arr.find(p => p.id === window.currentPlayer.id);
                if (meDoc?.newHint) {
                    showHintToast(meDoc.newHint);
                }
            }


            if (typeof window.renderScoreboard === "function") try { window.renderScoreboard(arr); } catch (e) { }
            if (typeof window.renderAdminScoreboard === "function") try { window.renderAdminScoreboard(); } catch (e) { }
        });

        // --- Monitor: prüft regelmäßig, ob wieder Opfer verfügbar sind ---
        let victimMonitorStarted = false;
        function monitorVictimAvailability() {
            if (victimMonitorStarted) return;
            victimMonitorStarted = true;

            const intervalMs = 15000; // alle 15s prüfen
            setInterval(() => {
                // nur relevant für Mörder
                const player = window.currentPlayer;
                if (!player || player.role !== "murderer") return;

                const availableVictims = (window.currentScores || []).filter(
                    s => s.id !== player.id && s.role !== "murderer" && (!s.blockedUntil || Date.now() >= s.blockedUntil)
                );

                const hasKillTask = TASKS.murderer.some(t => t.startsWith("Töte eine Person!"));

                if (availableVictims.length > 0 && !hasKillTask && player.murderCode) {
                    // wieder hinzufügen
                    TASKS.murderer.push(`Töte eine Person! `);
                    renderWheelForRole("murderer");
                } else if (availableVictims.length === 0 && hasKillTask) {
                    // entfernen
                    TASKS.murderer = TASKS.murderer.filter(t => !t.startsWith("Töte eine Person!"));
                    renderWheelForRole("murderer");
                }
            }, intervalMs);
        }

        // expose so other scripts (or after login) can start it
        window.monitorVictimAvailability = monitorVictimAvailability;

        // starten, sobald wir wissen, wer der aktuelle Spieler ist (z. B. nach login)
        if (window.currentPlayer?.role === "murderer") monitorVictimAvailability();

        function updateMurderTaskAvailability() {
            const player = window.currentPlayer;
            if (!player || player.role !== "murderer" || !player.murderCode) return;

            const availableVictims = (window.currentScores || []).filter(
                s => s.id !== player.id && s.role !== "murderer" && (!s.blockedUntil || Date.now() >= s.blockedUntil)
            );

            const hasKillTask = TASKS.murderer.some(t => t.startsWith("Töte eine Person!"));

            if (availableVictims.length > 0 && !hasKillTask) {
                // 🔹 Aufgabe wieder hinzufügen
                TASKS.murderer.push(`Töte eine Person!`);
                renderWheelForRole("murderer");
            } else if (availableVictims.length === 0 && hasKillTask) {
                // 🔹 Aufgabe entfernen
                TASKS.murderer = TASKS.murderer.filter(t => !t.startsWith("Töte eine Person!"));
                renderWheelForRole("murderer");

                // 🔹 Aktive Aufgabe abbrechen
                if (player.currentTask?.startsWith("Töte eine Person!")) {
                    if (availableVictims.length === 0 && hasKillTask) {
                        TASKS.murderer = TASKS.murderer.filter(t => !t.startsWith("Töte eine Person!"));
                        renderWheelForRole("murderer");
                        // ❌ nicht nullen, sonst geht Task verloren
                    }

                    $('currentTask').textContent = 'Dreh das Rad...';
                    $('actionBtn').textContent = 'Rad drehen';
                }
            }
        }
        window.updateMurderTaskAvailability = updateMurderTaskAvailability;

        function updateDetectiveTaskAvailability() {
            const player = window.currentPlayer;
            if (!player || player.role !== "detective") return;

            const availablePlayers = (window.currentScores ?? []).filter(p =>
                p.id !== player.id &&
                p.role !== "detective" &&
                (!p.blockedUntil || Date.now() >= p.blockedUntil)
            );

            const hasDetectiveTask = TASKS.detective.some(t =>
                t.startsWith("Das ist deine Chance den Mörder auszuschalten")
            );

            if (availablePlayers.length > 0 && !hasDetectiveTask) {
                TASKS.detective.push("Das ist deine Chance den Mörder auszuschalten!");
                renderWheelForRole("detective");
            } else if (availablePlayers.length === 0 && hasDetectiveTask) {
                TASKS.detective = TASKS.detective.filter(t =>
                    !t.startsWith("Das ist deine Chance den Mörder auszuschalten")
                );
                renderWheelForRole("detective");

                if (player.currentTask?.startsWith("Das ist deine Chance")) {
                    player.currentTask = null;
                    $('currentTask').textContent = "Dreh das Rad...";
                    $('actionBtn').textContent = "Rad drehen";
                }
            }
        }
        window.updateDetectiveTaskAvailability = updateDetectiveTaskAvailability;

        function updateCivilianTaskAvailability() {
            const player = window.currentPlayer;
            if (!player || player.role !== "civilian") return;

            const availableDetectives = (window.currentScores ?? []).filter(p =>
                p.role === "detective" &&
                (!p.blockedUntil || Date.now() >= p.blockedUntil)
            );

            const hasHintTask = TASKS.civilian.some(t =>
                t.startsWith("Sprich mit einer Person und sammle Hinweise zum Mörder")
            );

            if (availableDetectives.length === 0 && hasHintTask) {
                // 🧹 Entferne die Aufgabe
                TASKS.civilian = TASKS.civilian.filter(t =>
                    !t.startsWith("Sprich mit einer Person und sammle Hinweise zum Mörder")
                );
                renderWheelForRole("civilian");

                if (player.currentTask?.startsWith("Sprich mit einer Person")) {
                    player.currentTask = null;
                    $('currentTask').textContent = "Dreh das Rad...";
                    $('actionBtn').textContent = "Rad drehen";
                }
            } else if (availableDetectives.length > 0 && !hasHintTask) {
                // ✅ Wieder hinzufügen
                TASKS.civilian.push("Sprich mit einer Person und sammle Hinweise zum Mörder.");
                renderWheelForRole("civilian");
            }
        }
        window.updateCivilianTaskAvailability = updateCivilianTaskAvailability;

        // --- Mörder-Code Overlay ---
        const murderModal = $('murderCodeModal');
        const murderInput = $('murderCodeInput');
        const murderSubmitBtn = $('murderSubmitBtn');
        const murderCancelBtn = $('murderCancelBtn');

        function closeMurderModal() {
            murderModal.classList.add('hidden');
        }

        window.db = db;

    <script>
        /* ---------------------------
        UI / Game logic
        --------------------------- */
        const $ = id => document.getElementById(id);
        window.$ = $;


        const CONFIG = { murdererProb: 0.25, detectiveProb: 0.25 };


        const TASKS = {
            civilian: [
                'Sprich mit einer Person und sammle Hinweise zum Mörder.', //DIE AUFGABE DIE HINWEISE GEBNEN KANN
                'Mach ein Schwarz-Weiß-Foto mit 3 Leuten.',
                'Mach ein Selfie mit eier Person die einen Hut trägt.',
                // 'Trink mit jemandem, den du nicht kennst.',
                // 'Mach ein Schwarz-Weiß-Foto von 5 Personen.',

            ],
            detective: [
                "Das ist deine Chance den Mörder auszuschalten!",  //DIE AUFGABE DIE LEUTE SPERREN KANN
                'Trink mit einer Person und sammel hinweise zum Mörder!',
                'Befrage eine Person nach ihrem Alibi.',

            ],
            murderer: [
                'Töte eine Person!', //DIE AUFGABE DIE LEUTE SPERREN KANN
                'Versuch den verdacht von dir zu lenken indem du jemanden anderen als Mörder beschuldigst!',
                'Erfinde ein falsches Alibi und merk es dir fals dich ein Detektiv fragt.',

            ]
        };

        function roleLabel(r) {
            return r === 'murderer' ? 'MÖRDER' : r === 'detective' ? 'DETEKTIV' : 'CLUBBESUCHER';
        }
        function capitalizeFirstLetter(str) {
            if (!str) return '';
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        /* ---------- START / LOGIN ---------- */
        $('startBtn').addEventListener('click', async () => {
            const startBtn = $('startBtn');
            if (startBtn.disabled) return; // Kindersicherung: mehrfaches Klicken verhindern
            startBtn.disabled = true;      // Button sofort deaktivieren

            const raw = $('nameInput').value.trim();
            if (!raw) {
                startBtn.disabled = false;   // Falls kein Name eingegeben wurde, wieder aktivieren
                return;
            }

            const name = capitalizeFirstLetter(raw);
            if (name === "Clubbesitzer") {
                showAdminPanel();
                return;
            }

            const player = await window.loadPlayerFromDB(name);

            if (player.role === "detective" && player.newHint) {
                showHintToast(player.newHint);
            }

            if (!player.role) {
                const r = Math.random();
                if (r < CONFIG.murdererProb) player.role = 'murderer';
                else if (r < CONFIG.murdererProb + CONFIG.detectiveProb) player.role = 'detective';
                else player.role = 'civilian';
                await window.saveScore(player);
            }

            window.currentPlayer = player;
            animateIntro(player);
            startBlockCountdown();
        });

        /* ---------- ANIMATION & INTRO ---------- */
        // bleibt unverändert
        function animateIntro(player) {
            const startArea = $('startArea');
            const nameInput = $('nameInput');
            const roleArea = $('roleArea');


            roleArea.innerHTML = `
                <span id="nameSpan">${player.name}</span>
                <span id="duBistSpan"> du bist <span id="dotsSpan"></span></span>
                <div id="roleSpan">${roleLabel(player.role)}</div>
            `;


            const nameSpan = $('nameSpan');
            const duBistSpan = $('duBistSpan');

            const dotsSpan = $('dotsSpan');
            // Punktanimation starten
            const dots = ["", ".", "..", "..."];
            let i = 0;
            const dotInterval = setInterval(() => {
                if (dotsSpan.style.opacity === '1') {
                    dotsSpan.textContent = dots[i++ % dots.length];
                }
            }, 270);

            setTimeout(() => {
                clearInterval(dotInterval);
                dotsSpan.textContent = ""; // oder "..." falls du einen festen Abschluss willst
            }, 9000);

            const roleSpan = $('roleSpan');

            roleArea.style.opacity = '1';
            nameSpan.style.opacity = '0';
            duBistSpan.style.opacity = '0';
            dotsSpan.style.opacity = '0';
            roleSpan.style.opacity = '0';

            const inputRect = nameInput.getBoundingClientRect();
            const inputStyle = window.getComputedStyle(nameInput);
            const spanStyle = window.getComputedStyle(nameSpan);

            const flyingName = document.createElement('span');
            flyingName.textContent = player.name;
            document.body.appendChild(flyingName);
            flyingName.style.position = 'absolute';
            flyingName.style.font = spanStyle.font;
            flyingName.style.whiteSpace = 'nowrap';
            flyingName.style.color = inputStyle.color;
            flyingName.style.margin = '0';
            flyingName.style.padding = '0';
            flyingName.style.transition = 'transform 3s ease';

            const startX = inputRect.left + window.scrollX + parseFloat(inputStyle.paddingLeft || 0);
            const startY = inputRect.top + window.scrollY + parseFloat(inputStyle.paddingTop || 0);
            flyingName.style.left = `${startX}px`;
            flyingName.style.top = `${startY}px`;

            nameInput.style.transition = 'opacity 3s linear';
            startArea.querySelector('button').style.transition = 'opacity 3s linear';
            setTimeout(() => {
                nameInput.style.opacity = '0';
                startArea.querySelector('button').style.opacity = '0';
            }, 0);
            setTimeout(() => {
                nameInput.style.display = 'none';
                startArea.querySelector('button').style.display = 'none';
            }, 3000); //Überall 0 entfert

            const targetRect = nameSpan.getBoundingClientRect();
            const deltaX = targetRect.left + window.scrollX - startX;
            const deltaY = targetRect.top + window.scrollY - startY;

        /* ---------- WHEEL RENDER + TASKS ---------- */
        function maybeAddMurderTask(tasks, player) {
            if (!player || player.role !== "murderer" || !player.murderCode) return tasks;

            // Prüfe, ob es noch freie Opfer gibt (nicht gesperrt)
            const availableVictims = (window.currentScores || []).filter(
                s => s.role !== "murderer" && (!s.blockedUntil || Date.now() >= s.blockedUntil)
            );

            // Wenn keine Opfer frei → keine Mörder-Aufgabe hinzufügen
            if (availableVictims.length === 0) {
                console.warn("Alle Opfer gesperrt – Mörder-Aufgabe übersprungen.");
                return tasks.filter(t => !t.startsWith("Töte eine Person!")); // sicherstellen, dass keine alte drin bleibt
            }

            // Doppelte "Töte"-Tasks entfernen
            tasks = tasks.filter(t => !t.startsWith("Töte eine Person!"));
            tasks.push(`Töte eine Person!`);
            return tasks;
        }

        async function renderWheelForRole(role) {
            let tasks = TASKS[role] ?? [];
            if (role === "murderer") {
                tasks = maybeAddMurderTask(tasks, window.currentPlayer);
            }

            const n = tasks.length;
            const slice = 360 / n;
            const COLORS = ['#999999', '#808080'];
            let grad = 'conic-gradient(';
            for (let i = 0; i < n; i++) {
                grad += `${COLORS[i % COLORS.length]} ${i * slice}deg ${(i + 1) * slice}deg${i < n - 1 ? ',' : ''}`;
            }
            grad += ')';

            const wheel = $('wheel');
            wheel.style.background = grad;
            wheel.dataset.tasks = JSON.stringify(tasks);

            const taskDisplay = $('currentTask');
            const currentPlayer = window.currentPlayer;
            const currentTask = currentPlayer?.currentTask ?? 'Dreh das Rad...';

            if (taskDisplay) {
                taskDisplay.classList.remove('hidden');
                taskDisplay.style.display = 'block';

                // Safari-Fix: Inhalt leeren + neu setzen
                taskDisplay.innerHTML = '';
                taskDisplay.innerText = currentTask;

                // Safari-Fix: Sichtbarkeit toggeln
                taskDisplay.style.visibility = 'hidden';
                void taskDisplay.offsetHeight;
                taskDisplay.style.visibility = 'visible';

                // Safari-Fix: Force repaint über CSS-Hack
                taskDisplay.style.transform = 'scale(1.001)';
                setTimeout(() => {
                    taskDisplay.style.transform = 'scale(1)';
                }, 50);
            }

            setTimeout(() => {
                const taskDisplay = $('currentTask');
                if (taskDisplay) {
                    taskDisplay.innerHTML = '';
                    taskDisplay.innerText = window.currentPlayer?.currentTask ?? 'Dreh das Rad...';
                    void taskDisplay.offsetHeight;
                }
            }, 100); // Safari braucht manchmal einen kleinen Delay
        }

            const tasks = JSON.parse($('wheel').dataset.tasks || '[]');

            const currentTask = player.currentTask;

            // --- FALL 1: Spieler hat bereits eine Aufgabe ---
            if (currentTask) {
                // Mörder-Aufgabe
                if (currentTask.startsWith("Töte eine Person!")) {
                    const availableVictims = (window.currentScores || []).filter(p =>
                        p.id !== player.id &&
                        p.role !== "murderer" &&
                        (!p.blockedUntil || p.blockedUntil < Date.now())
                    );

                    if (availableVictims.length === 0) {

                        player.currentTask = null;
                        $('currentTask').textContent = 'Dreh das Rad...';

                    }

                    btn.textContent = "Opfer auswählen";

                // Hinweis-Aufgabe
                if (currentTask.startsWith("Sprich mit einer Person")) {

                    return;
                }

                // Normale Aufgabe
                await addCompleted(currentTask);

                $('currentTask').textContent = 'Dreh das Rad...';
                btn.textContent = 'Rad drehen';

            }

            // --- FALL 2: Kein aktiver Task → Rad drehen ---
            spinning = true;
            btn.disabled = true;
            btn.textContent = 'Dreht...';
            document.body.style.overflow = 'hidden';

            const n = tasks.length;
            const slice = 360 / n;
            const targetIdx = Math.floor(Math.random() * n);
            const spins = 5;
            const target = 360 * spins + (targetIdx * slice) + slice / 2;
            const duration = 3000;

            $('wheel').style.transition = `transform ${duration / 1000}s cubic-bezier(.17,.67,.34,1)`;
            $('wheel').style.transform = `rotate(${target}deg)`;

            // Flacker-Effekt
            const steps = 60;
            let step = 0;
            const stepTime = duration / steps;
            const flasher = setInterval(() => {
                const idx = step % tasks.length;
                $('currentTask').textContent = tasks[idx];
                step++;
                if (step >= steps) clearInterval(flasher);
            }, stepTime);

            await new Promise(r => setTimeout(r, duration));
            $('wheel').style.transition = '';
            $('wheel').style.transform = `rotate(${(targetIdx * slice + slice / 2) % 360}deg)`;

            const newTask = tasks[targetIdx];
            player.currentTask = newTask;
            setTimeout(() => {
                const taskDisplay = $('currentTask');
                if (taskDisplay) {
                    taskDisplay.innerHTML = '';
                    taskDisplay.innerText = window.currentPlayer?.currentTask ?? 'Dreh das Rad...';
                    taskDisplay.style.visibility = 'hidden';
                    void taskDisplay.offsetHeight;
                    taskDisplay.style.visibility = 'visible';
                    taskDisplay.style.transform = 'scale(1.001)';
                    setTimeout(() => {
                        taskDisplay.style.transform = 'scale(1)';
                    }, 50);
                }
            }, 100); // Safari braucht kleinen Delay
            const taskDisplay = $('currentTask');
            if (taskDisplay) {
                taskDisplay.classList.remove('hidden');
                taskDisplay.style.display = 'block';
                taskDisplay.textContent = newTask;
                void taskDisplay.offsetHeight;
            }
            updateActionButton();

            // --- Wenn Mörder-Aufgabe, aber keine Opfer frei: überspringen ---
            if (player.role === "murderer" && newTask.startsWith("Töte eine Person!")) {
                const availableVictims = (window.currentScores || []).filter(
                    s => s.role !== "murderer" && (!s.blockedUntil || Date.now() >= s.blockedUntil)
                );
                if (availableVictims.length === 0) {
                    showToast("🔄 Alle Opfer gesperrt! Aufgabe übersprungen.");
                    player.currentTask = null;
                    $('currentTask').textContent = "Dreh das Rad...";
                    btn.textContent = "Rad drehen";
                    btn.disabled = false;
                    spinning = false;
                    document.body.style.overflow = '';
                    return;
                }
            }

            // --- Abschluss: Button anpassen ---
            btn.disabled = false;
            btn.textContent = 'Erledigt';
            spinning = false;
            document.body.style.overflow = '';
        });

        // --- Vorlagen ---

        // Hinweis senden — nutzt die vorhandene sendClueToDetective(hint)
        hintSendBtn.onclick = async () => {
            try {
                if (hintSendBtn.disabled) return;
                hintSendBtn.disabled = true;

                const player = window.currentPlayer;
                if (!player || !player.currentTask) {
                    hintSendBtn.disabled = false;
                    return;
                }

                const template = hintSelect.value?.trim();
                const freeText = hintInput.value?.trim();

                // 🟡 Pflicht: Satzvorlage muss gewählt werden
                if (!template) {
                    showToast("⚠️ Bitte wähle eine Satzvorlage aus!");
                    hintSendBtn.disabled = false;
                    return;
                }

                // 🟡 Pflicht: Eingabefeld darf nicht leer sein
                if (!freeText || freeText.length < 1) {
                    showToast("⚠️ Bitte vervollständige den Satz!");
                    hintSendBtn.disabled = false;
                    return;
                }

                // 🔹 Vollständigen Hinweis zusammenbauen
                const hint = template.replace("___", freeText);
                const lower = hint.toLowerCase();

                // 🔹 Filter: Spielernamen + Beleidigungen
                const playerNames = (window.currentScores || [])
                    .map(p => p.name?.toLowerCase())
                    .filter(Boolean);

                const badWords = [
                    "idiot", "dumm", "arsch", "opfer", "wichser", "spast", "hurensohn",
                    "bastard", "mongo", "scheiße", "verpiss", "fick", "fotze", "penner",
                    "pissa", "blat", "mist", "blöd", "arsch", "pisdetz", "nichuja", "blat",
                    "wort", "wort", "wort", "wort", "wort", "wort", "wort", "wort", "wort",
                ];

                const disabledWords = [
                    "nö", "nein", "warum"
                ];

                // Enthält Spielernamen?
                for (const name of playerNames) {
                    if (name && lower.includes(name)) {
                        showToast("❌ Du darfst keine Spielernamen im Hinweis verwenden!");
                        hintSendBtn.disabled = false;
                        return;
                    }
                }

                // Enthält Beleidigung?
                for (const word of badWords) {
                    if (lower.includes(word)) {
                        showToast("❌ Immer höflich bleiben! Dein Hinweis enthält beleidigungen");
                        hintSendBtn.disabled = false;
                        return;
                    }
                }

                // Enthält unzulässige Wörter?
                for (const word of disabledWords) {
                    if (lower.includes(word)) {
                        showToast("❌ Dein Hinweis enthält unzulässige Wörter!");
                        hintSendBtn.disabled = false;
                        return;
                    }
                }

                // 🔹 Wenn alles okay → Hinweis senden
                const success = await sendClueToDetective(hint);
                if (!success) {
                    showToast("❌ Kein Detektiv verfügbar oder Fehler beim Senden!");
                    hintSendBtn.disabled = false;
                    return;

                // ✅ Aufgabe als erledigt markieren
                await addCompleted(player.currentTask);

                // UI zurücksetzen
                player.currentTask = null;
                $('currentTask').textContent = 'Dreh das Rad...';
                $('actionBtn').textContent = 'Rad drehen';
                closeHintModal();
                hintInput.value = '';
                hintSelect.selectedIndex = 0;

            } catch (err) {
                console.error("Fehler beim Senden des Hinweises:", err);
                showToast("❌ Fehler beim Senden des Hinweises!");
            } finally {
                hintSendBtn.disabled = false;
            }
        };

        /* ---------- BLOCK / COUNTDOWN ---------- */
        const BLOCK_DURATION = 15 * 60 * 1000;
        let blockCountdownInterval = null;

        function startBlockCountdown() {
            const actionBtn = $('actionBtn');
            const player = window.currentPlayer;
            if (!player || !actionBtn) return;

            // Vorherigen Countdown stoppen
            if (blockCountdownInterval) {
                clearInterval(blockCountdownInterval);
                blockCountdownInterval = null;
            }

            const updateCountdown = () => {
                const remaining = player.blockedUntil - Date.now();
                if (remaining <= 0) {
                    actionBtn.disabled = false;
                    actionBtn.textContent = "Rad drehen";
                    player.blockedUntil = 0;
                    clearInterval(blockCountdownInterval);
                    blockCountdownInterval = null;
                } else {
                    const minutes = Math.floor(remaining / 60000);
                    const seconds = Math.floor((remaining % 60000) / 1000);
                    actionBtn.textContent = `Blockiert: ${minutes}:${seconds.toString().padStart(2, '0')}`;
                    actionBtn.disabled = true;
                }
            };

            if (player.blockedUntil && Date.now() < player.blockedUntil) {
                updateCountdown();
                blockCountdownInterval = setInterval(updateCountdown, 1000);
            } else {
                actionBtn.disabled = false;
                actionBtn.textContent = "Rad drehen";
            }
        }

        /* ---------- COMPLETED / SCORE ---------- */
        async function addCompleted(task) {
            if (!window.currentPlayer) return;
            window.currentPlayer.completed = window.currentPlayer.completed || [];
            window.currentPlayer.completed.push({ task, date: new Date().toLocaleString() });
            window.currentPlayer.score = (window.currentPlayer.score || 0) + 1;

            // console.log("🟢 addCompleted:", window.currentPlayer.name, "→", window.currentPlayer.score);

            await window.saveScore(window.currentPlayer);

        /* ---------- SCOREBOARD / OVERLAY / ADMIN ---------- */
        function renderScoreboard(scores) {
            const tbody = document.querySelector('#scoreboard tbody');
            if (!tbody) return;
            tbody.innerHTML = '';

            if (!Array.isArray(scores)) scores = window.currentScores ?? [];

            // Sortiere nach Score
            scores.sort((a, b) => (b.score ?? 0) - (a.score ?? 0));

            // Zähle Namen + IDs stabil
            const nameMap = {};
            scores.forEach((player) => {
                const baseName = player.name;
                if (!nameMap[baseName]) nameMap[baseName] = [];
                nameMap[baseName].push(player.id);
            });

            const displayNames = {};
            Object.entries(nameMap).forEach(([name, ids]) => {
                ids.forEach((id, index) => {
                    displayNames[id] = index === 0 ? name : `${name} (${index + 1})`;
                });
            });

            // Anzeige
            scores.forEach((player) => {
                const tr = document.createElement('tr');
                const displayName = displayNames[player.id] ?? player.name;
                tr.innerHTML = `<td>${displayName}</td><td>${player.score ?? 0}</td>`;
                tbody.appendChild(tr);
            });
        }

            doneOverlay.classList.add('hidden');    // Overlay schließen
        });

        function renderOverlay() {
            renderScoreboard();
            renderTasks();
        }

        function renderTasks() {
            const list = $('doneOverlayList');
            list.innerHTML = '';
            const tasks = window.currentPlayer?.completed?.slice().reverse() || [];
            if (tasks.length === 0) list.innerHTML = '<p>Keine erledigten Aufgaben.</p>';
            else tasks.forEach(e => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<div><strong>${e.task}</strong></div><div class="muted">${e.date}</div>`;
                list.appendChild(div);
            });
        }
        // -----------------------------
        // Robuster Task-Watcher + Button-Text-Updater
        // Einfügen ganz unten in dein <script>
        // -----------------------------
        (function () {
            // Verhindern, dass der Watcher mehrfach gestartet wird
            if (window.__taskWatcherStarted) return;
            window.__taskWatcherStarted = true;

            // Extrahiert den Aufgabentext zuverlässig aus verschiedenen Input-Typen
            function _extractTaskText(input) {
                // Wenn string -> direkt verwenden
                if (typeof input === 'string') return input;

                // Falls undefined/null -> aus currentPlayer holen
                if (!input) return (window.currentPlayer && window.currentPlayer.currentTask) || '';

                // Wenn Objekt mit .task (z.B. ein Completed-Objekt)
                if (typeof input === 'object') {
                    if (typeof input.task === 'string') return input.task;

                    // Wenn es ein Event zu sein scheint (hat type und target) -> fallback auf currentPlayer
                    if ('type' in input && 'target' in input) {
                        return (window.currentPlayer && window.currentPlayer.currentTask) || '';
                    }
                }

                // Letzter Fallback
                return (window.currentPlayer && window.currentPlayer.currentTask) || '';
            }

            // Setzt den Button-Text passend zur aktuellen Aufgabe.
            // taskOrEvent kann String | Event | Objekt | undefined sein.
            function updateActionButtonText(taskOrEvent) {
                const btn = document.getElementById('actionBtn');
                if (!btn) return;

                const taskText = _extractTaskText(taskOrEvent) || '';

                // sichere Prüfung (nur wenn es wirklich ein String ist)
                if (typeof taskText === 'string') {
                    if (taskText.startsWith("Töte eine Person!")) {
                        btn.textContent = "Person Töte...";
                    } else if (taskText.startsWith("Sprich mit einer Person")) {
                        btn.textContent = "Hinweis geben";
                    } else if (taskText.startsWith("Das ist deine Chance den Mörder auszuschalten!")) {
                        btn.textContent = 'Person sperren';
                    } else if (taskText !== "") {
                        btn.textContent = "Erledigt";
                    } else {
                        btn.textContent = "Rad drehen";
                    }
                } else {
                    // Falls irgendwas unerwartetes kommt, greife auf currentPlayer zurück
                    const fallback = (window.currentPlayer && window.currentPlayer.currentTask) ? "Erledigt" : "Rad drehen";
                    btn.textContent = fallback;
                }

                btn.disabled = false;
            }

            // global verfügbar (optional, nützlich falls du es manuell aufrufen willst)
            window.updateActionButtonText = updateActionButtonText;

            // initial setzen (falls schon ein Task da ist)
            updateActionButtonText();

            // Watcher: prüft regelmäßig ob sich currentTask geändert hat
            let lastTask = (window.currentPlayer && window.currentPlayer.currentTask) || '';
            setInterval(() => {
                const nowTask = (window.currentPlayer && window.currentPlayer.currentTask) || '';
                if (nowTask !== lastTask) {
                    lastTask = nowTask;
                    updateActionButtonText(nowTask);
                }
            }, 100); // 100ms ist reaktionsschnell, aber leicht auf Performance geachtet
        })();

        // 🔹 Immer aufrufen, wenn currentTask sich ändern könnte
        const originalAddCompleted = window.addCompleted;
        window.addCompleted = async function (task) {
            await originalAddCompleted(task);
            updateActionButtonText();
        };

        $('actionBtn').addEventListener('click', updateActionButtonText);

        function showToast(msg) {
            const toast = $('toast');
            toast.textContent = msg;

            // Vorbereitungen: vorherige Zustände zurücksetzen
            toast.classList.remove("hidden", "show");

            // Kleiner Trick: erzwinge ein Reflow, damit die Animation sauber startet
            void toast.offsetWidth;

            // Sanft einblenden
            toast.classList.add("show");

            // Nach 6 Sekunden sanft ausblenden
            setTimeout(() => {
                toast.classList.remove("show");

                // Nach der Transition (600ms) wieder ausblenden
                setTimeout(() => {
                    toast.classList.add("hidden");
                }, 600);
            }, 6000);
        }

        function showHintToast(hintText) {
            setTimeout(() => {
                const hintToast = $('hintToast');
                const message = $('hintToastMessage');
                const closeBtn = $('hintToastClose');

                message.textContent = `🕵️ Du hast einen anonymen Hinweis erhalten: "${hintText}"`;

                // Startzustand: sicherstellen, dass keine alten Klassen stören
                hintToast.classList.remove('hidden', 'hide');
                void hintToast.offsetWidth; // Reflow, um Transition zu resetten
                hintToast.classList.add('show');

                closeBtn.onclick = async () => {
                    // Sanft ausblenden
                    hintToast.classList.remove('show');
                    hintToast.classList.add('hide');

                    // Nach der Animation (600 ms) wieder "hidden" setzen
                    setTimeout(async () => {
                        hintToast.classList.add('hidden');
                        hintToast.classList.remove('hide');

                        // Hinweis im Firestore löschen
                        if (window.currentPlayer?.id) {
                            await setDoc(
                                doc(db, "scores", window.currentPlayer.id),
                                { newHint: null },
                                { merge: true }
                            );
                        }
                    }, 600);
                };
            }, 14000);
        }

        function checkConnection() {
            if (!navigator.onLine) {
                showToast("❌ Keine Internetverbindung!");
                return false;
            }
            return true;
        }

        setInterval(() => {
            if (!navigator.onLine) {
                showToast("⚠️ Du bist offline. Änderungen werden nicht gespeichert.");
            }
        }, 5000); // alle 5 Sekunden

    </script>
